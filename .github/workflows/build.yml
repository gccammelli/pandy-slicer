# Tests the slicer's logic and builds the image on every push and pull request.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover tests -v

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the add-on image (amd64)
        run: docker build -t pandy-slicer pandy_slicer
      - name: Bambu Studio starts in it
        run: docker run --rm pandy-slicer /opt/bambu-studio/AppRun --help | head -1
