name: Auto-merge first-party maintenance

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       (github.event.pull_request.user.login == 'gccammelli' &&
        contains(github.event.pull_request.labels.*.name, 'first-party-maintenance') &&
        !contains(github.event.pull_request.labels.*.name, 'needs-maintainer-approval') &&
        !startsWith(github.event.pull_request.head.ref, 'cammelli-bot/issue-'))) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge after required checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash
