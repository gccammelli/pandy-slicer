name: Pandy Slicer
version: "1.4.1"
slug: pandy_slicer
description: Slices MakerWorld models with Bambu Studio so the Pandy app can print them.
url: https://github.com/gccammelli/pandy-slicer
# Bambu Studio is only published for x86-64 Linux.
arch:
  - amd64
init: false
startup: application
boot: auto
# Pandy reaches the slicer through Home Assistant (ingress), signed in with Home Assistant's own token.
ingress: true
ingress_port: 8737
# Off by default: only for apps that can't go through Home Assistant. Turn it on under the add-on's Network settings.
ports:
  8737/tcp: null
ports_description:
  8737/tcp: Direct access, without Home Assistant (not needed by Pandy)
options:
  token: ""
schema:
  token: password?
