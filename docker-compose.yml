# Pandy Slicer without Home Assistant: `docker compose up -d` in this folder, then give Pandy http://<this machine>:8737.
services:
  pandy-slicer:
    build: ./pandy_slicer
    image: pandy-slicer
    restart: unless-stopped
    ports:
      - "8737:8737"
    environment:
      # Required: without a token the slicer refuses every request. Put a long random one in .env next to this file
      # (PANDY_SLICER_TOKEN=..., e.g. from `openssl rand -hex 24`) and enter the same one in Pandy.
      PANDY_SLICER_TOKEN: ${PANDY_SLICER_TOKEN:?Set PANDY_SLICER_TOKEN in .env}
